name: Deploy public legal pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Regenerate third-party notices
        run: yarn notices

      - name: Require publish date in legal pages
        run: |
          if grep -l PUBLISH_DATE_TBD public/legal.html docs/PRIVACY_POLICY.md; then
            echo "::error::Replace PUBLISH_DATE_TBD with the actual publish date (docs/DONATION.md)"
            exit 1
          fi

      - name: Prepare Pages artifact (legal + third-party only)
        run: |
          mkdir -p .pages-deploy
          cp public/legal.html public/legal.js public/third-party-notices.html .pages-deploy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
